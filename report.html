<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HIS 출결상황보고서</title>
<style>
:root{--navy:#183b56;--blue:#2f78c4;--line:#d8e0e7;--muted:#657786;--bg:#f4f7f9;--danger:#b33a3a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#1f2d38;font-family:"Noto Sans KR","Malgun Gothic",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.gate-card{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;text-align:center;box-shadow:0 5px 18px #183b5614}.gate-mark{width:48px;height:48px;margin:0 auto 12px;border-radius:13px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800}.gate h1{font-size:21px;margin:0 0 7px}.gate p{color:var(--muted);font-size:13px;line-height:1.55}.primary,.ghost{border:0;border-radius:8px;padding:8px 13px;font-weight:700}.primary{background:var(--navy);color:#fff}.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}#gate,#denied,#app{display:none}.spinner{width:30px;height:30px;border:3px solid #d9e3ea;border-top-color:var(--blue);border-radius:50%;margin:auto;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.topbar{position:sticky;top:0;z-index:20;background:#fffffff7;border-bottom:1px solid var(--line)}.topbar>div{max-width:1380px;min-height:48px;margin:auto;padding:5px 16px;display:flex;align-items:center;gap:8px}.brand{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800}.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:11px}.actions{margin-left:auto;display:flex;gap:6px;align-items:center}.actions button{padding:6px 9px;font-size:12px}.user{font-size:11px;color:var(--muted);max-width:150px;overflow:hidden;text-overflow:ellipsis}main{max-width:1380px;margin:auto;padding:10px 16px 30px}.heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}.heading h1{font-size:20px;color:var(--navy);margin:0}.heading small{color:var(--muted);font-weight:400;margin-left:7px}
.filters{background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px 11px;margin-bottom:8px}.filter-row{display:flex;align-items:flex-end;gap:9px;flex-wrap:wrap}.control label,.choice>span{display:block;font-size:11px;font-weight:800;color:var(--navy);margin-bottom:4px}.control select,.control input{height:34px;border:1px solid #c9d5de;border-radius:8px;background:#fff;padding:0 8px}.control select{width:105px}.control input{width:140px}.button-group{display:flex;gap:4px;flex-wrap:wrap}.choice-btn{height:34px;min-width:46px;padding:0 10px;border:1px solid #c9d5de;border-radius:8px;background:#fff;color:#405666;font-size:12px;font-weight:700}.choice-btn.active{background:var(--navy);border-color:var(--navy);color:#fff}.filter-actions{display:flex;gap:5px;margin-left:auto}.filter-actions button{height:34px;padding:0 13px}.note,.status{margin:6px 1px 0;color:var(--muted);font-size:11px;line-height:1.4}.note strong{color:var(--navy)}.status{min-height:15px}.error{color:var(--danger)}
.summary{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:8px}.summary>div{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 9px}.summary small{display:block;color:var(--muted);font-size:10px}.summary b{font-size:17px;color:var(--navy)}.panel{background:#fff;border:1px solid var(--line);border-radius:11px;overflow:hidden}.panel-head{padding:7px 11px;border-bottom:1px solid var(--line);display:flex;align-items:center;background:linear-gradient(90deg,#eef6eb,#fff)}.panel-head h2{font-size:15px;color:var(--navy);margin:0}.meta{margin-left:auto;font-size:11px;color:var(--muted)}.table-wrap{overflow:auto;max-height:calc(100vh - 270px)}table{width:100%;border-collapse:collapse;min-width:1020px}thead{position:sticky;top:0;z-index:2}th{background:#eef1f3;font-size:11px;padding:7px 6px;border-bottom:1px solid #aeb9c2;white-space:nowrap}td{font-size:12px;padding:6px;border-bottom:1px solid #e3e8ec;text-align:center}tbody tr:nth-child(even){background:#fafcfd}td.reason{text-align:left;min-width:180px;white-space:pre-wrap}.name,.school,.neis{font-weight:700}.school{color:var(--blue)}.neis{color:var(--navy)}.pill{display:inline-block;border:1px solid transparent;border-radius:99px;padding:2px 7px;font-size:11px;font-weight:800}.pill.absence{background:#fdeaea;border-color:#f4bcbc;color:#a62d2d}.pill.late{background:#fff2d9;border-color:#f2cf82;color:#8a5b00}.pill.early{background:#e9f1ff;border-color:#b9cff3;color:#285f9f}.pill.result{background:#eee9f8;border-color:#cfc0e9;color:#624391}.pill.other{background:#edf1f4;border-color:#d1d9df;color:#526674}.doc{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;font-size:11px}.doc input{width:16px;height:16px;accent-color:var(--navy)}.empty,.loading{padding:40px 18px;text-align:center;color:var(--muted)}.loading:before{content:"";display:block;width:24px;height:24px;border:3px solid #d9e3ea;border-top-color:var(--blue);border-radius:50%;margin:0 auto 8px;animation:spin .8s linear infinite}
@media(max-width:800px){.filter-actions{margin-left:0}.summary{grid-template-columns:repeat(3,1fr)}.table-wrap{max-height:none}}@media(max-width:650px){.user{display:none}main{padding:8px}.heading h1{font-size:17px}.heading small,.heading .ghost{display:none}.control{width:calc(50% - 5px)}.control select,.control input{width:100%}.choice,.filter-actions{width:100%}.choice-btn,.filter-actions button{flex:1}.panel-head{display:block}.meta{margin:2px 0 0}.table-wrap{overflow:visible}table{min-width:0}thead{display:none}tbody{display:block;padding:6px}tr{display:block;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;padding:4px}td{display:grid;grid-template-columns:88px 1fr;text-align:left;padding:4px;border:0}td:before{content:attr(data-label);font-size:10px;color:var(--muted);font-weight:700}}@media print{@page{size:A4 landscape;margin:8mm}.topbar,.filters,.heading .ghost,.status{display:none!important}body{background:#fff}main{max-width:none;padding:0}.summary{gap:2px;margin-bottom:4px}.summary>div{padding:3px;border-radius:0}.summary b{font-size:11px}.panel{border-radius:0}.table-wrap{max-height:none;overflow:visible}table{min-width:0}th,td{font-size:8px;padding:3px}.doc input{width:10px;height:10px}}
</style></head><body>
<section id="loading" class="gate"><div class="gate-card"><div class="spinner"></div><p>로그인 상태와 교직원 권한을 확인하고 있습니다.</p></div></section>
<section id="gate" class="gate"><div class="gate-card"><div class="gate-mark">출</div><h1>출결상황보고서</h1><p>등록된 HIS 교직원 계정으로 로그인하세요.</p><button id="login" class="primary">Google 계정으로 로그인</button><div id="gate-error" class="error"></div></div></section>
<section id="denied" class="gate"><div class="gate-card"><div class="gate-mark" style="background:var(--danger)">!</div><h1>접근 권한 없음</h1><p id="denied-email"></p><button id="denied-logout" class="ghost">로그아웃</button></div></section>
<div id="app"><header class="topbar"><div><div class="brand"><span class="brand-mark">HIS</span>출결상황보고서</div><div class="actions"><span id="user" class="user"></span><button id="back" class="ghost">출결 앱</button><button id="logout" class="ghost">로그아웃</button></div></div></header><main>
<div class="heading"><h1>출결상황보고서 <small>NEIS 학년·반·번호 기준</small></h1><button id="print" class="ghost">인쇄 / PDF</button></div>
<section class="filters"><div class="filter-row"><div class="control"><label>학년도</label><select id="year"></select></div><div class="control"><label>월</label><input id="month" type="month"></div><div class="choice"><span>학교급</span><div id="levels" class="button-group"></div></div><div class="choice"><span>NEIS 학년</span><div id="grades" class="button-group"></div></div><div class="choice"><span>NEIS 반</span><div id="classes" class="button-group"></div></div><div class="filter-actions"><button id="load" class="primary">조회</button><button id="reset" class="ghost">초기화</button></div></div><p class="note"><strong>조회 기준은 NEIS로 고정됩니다.</strong> 저장된 NEIS 학년·반·번호만 사용하며 학교 반에서 추정하지 않습니다. 결과에는 학교 반과 NEIS 반을 함께 표시합니다.</p><div id="status" class="status"></div></section>
<section id="summary" class="summary"></section><section class="panel"><div class="panel-head"><h2 id="title">조회 조건을 선택하세요</h2><div id="meta" class="meta"></div></div><div id="body" class="empty">월·NEIS 학년·반을 선택하고 조회하세요.</div></section>
</main></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";import{initializeFirestore,doc,getDoc,collection,query,where,getDocs,updateDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyBeSyJY2pET002knu7KWKuqV-Nkhy7OEHQ",authDomain:"his-main.firebaseapp.com",projectId:"his-main",storageBucket:"his-main.firebasestorage.app",messagingSenderId:"311279275648",appId:"1:311279275648:web:3609db730ec2b0e77ea065"},fa=initializeApp(cfg),auth=getAuth(fa),db=initializeFirestore(fa,{experimentalAutoDetectLongPolling:true}),provider=new GoogleAuthProvider();provider.setCustomParameters({hd:"his.sc.kr"});
const $=id=>document.getElementById(id),cache=new Map(),CACHE_KEY="hisAttendanceReportRoster_v2";let user,staff,year="",roster=[],level="MS",grade="",cls="",canDocs=false;
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]),cmp=(a,b)=>String(a).localeCompare(String(b),"ko",{numeric:true}),schoolLevel=s=>{const x=String(s.schoolLevel||"").toUpperCase(),g=+s.grade;return["MS","HS"].includes(x)?x:g>=7&&g<=9?"MS":g>=10&&g<=12?"HS":""};
function normalizeRoster(records){return(records||[]).map(s=>({...s,email:String(s.email||""),name:String(s.name||""),grade:String(s.grade||""),cls:String(s.cls||""),num:String(s.num||""),schoolLevel:schoolLevel(s),neisClassGroup:String(s.neisClassGroup||""),neisCls:String(s.neisCls||""),neisNum:String(s.neisNum||"")})).filter(s=>s.email&&s.name&&s.schoolLevel)}
async function getRoster(y){try{const c=JSON.parse(localStorage.getItem(CACHE_KEY)||"null"),normalized=normalizeRoster(c?.data);if(String(c?.year)===String(y)&&Date.now()-c.at<43200000&&normalized.some(s=>s.neisClassGroup&&s.neisCls))return normalized}catch(_){}const snap=await getDocs(query(collection(db,"studentRecords"),where("year","==",String(y)))),raw=[];snap.forEach(d=>raw.push(d.data()));const data=normalizeRoster(raw);try{localStorage.setItem(CACHE_KEY,JSON.stringify({year:String(y),at:Date.now(),data}))}catch(_){}return data}
function buttons(id,values,selected,label=v=>v){$(id).innerHTML=values.map(v=>`<button class="choice-btn${v===selected?" active":""}" data-value="${esc(v)}">${esc(label(v))}</button>`).join("")}
function renderFilters(){buttons("levels",["MS","HS"],level,v=>v==="MS"?"중등":"고등");const lr=roster.filter(s=>s.schoolLevel===level),gs=[...new Set(lr.map(s=>s.neisClassGroup).filter(Boolean))].sort(cmp);if(grade&&!gs.includes(grade))grade="";buttons("grades",["",...gs],grade,v=>v||"전체");const cs=[...new Set(lr.filter(s=>!grade||s.neisClassGroup===grade).map(s=>s.neisCls).filter(Boolean))].sort(cmp);if(cls&&!cs.includes(cls))cls="";buttons("classes",["",...cs],cls,v=>v||"전체")}
function bounds(k){const[y,m]=k.split("-").map(Number);return{a:`${y}-${String(m).padStart(2,"0")}-01`,b:`${y}-${String(m).padStart(2,"0")}-${new Date(y,m,0).getDate()}`}}function dates(a,b,k){const x=bounds(k);a=a<x.a?x.a:a;b=b>x.b?x.b:b;if(!a||!b||b<a)return[];const out=[],d=new Date(a+"T00:00:00"),e=new Date(b+"T00:00:00");while(d<=e){out.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`);d.setDate(d.getDate()+1)}return out}
async function reports(k){if(cache.has(k))return cache.get(k);const snap=await getDocs(query(collection(db,"attendanceReports"),where("monthKeys","array-contains",k))),out=[];snap.forEach(d=>out.push({id:d.id,...d.data()}));cache.set(k,out);return out}
function rowsOf(rs,k){const by=new Map(roster.map(s=>[s.email.toLowerCase(),s])),rows=[];let missing=0,noNeis=0;rs.forEach(r=>{const s=by.get(String(r.studentEmail||"").toLowerCase());if(!s){missing++;return}if(s.schoolLevel===level&&(!s.neisClassGroup||!s.neisCls)){noNeis++;return}if(s.schoolLevel!==level||!s.neisClassGroup||!s.neisCls||(grade&&s.neisClassGroup!==grade)||(cls&&s.neisCls!==cls))return;dates(r.startDate,r.endDate,k).forEach(date=>rows.push({id:r.id,date,num:s.neisNum||s.num,school:`${s.grade}${s.cls}`,neis:`${s.neisClassGroup}-${s.neisCls}`,name:s.name,type:r.attendanceType||`${r.detail||""}${r.category||""}`,category:r.category||"",reason:r.reason||"",periods:Array.isArray(r.periods)?r.periods.join(", "):String(r.periods||""),submitted:r.documentSubmitted===true,checkedBy:r.documentCheckedByName||r.documentCheckedBy||"",email:s.email}))});rows.sort((a,b)=>cmp(a.date,b.date)||cmp(a.num,b.num)||cmp(a.name,b.name));return{rows,missing,noNeis}}
function renderSummary(rows){const cats=["결석","지각","조퇴","결과"],v=[["표시 행",rows.length],["학생",new Set(rows.map(r=>r.email)).size],...cats.map(c=>[c,rows.filter(r=>r.category===c).length])];$("summary").innerHTML=v.map(x=>`<div><small>${x[0]}</small><b>${x[1]}</b></div>`).join("")}
function docCell(r){const title=r.submitted&&r.checkedBy?`확인: ${r.checkedBy}`:canDocs?"서류 제출 여부 변경":"서류 권한자만 변경 가능";return`<label class="doc" title="${esc(title)}"><input class="doc-check" type="checkbox" data-id="${esc(r.id)}" ${r.submitted?"checked":""} ${canDocs?"":"disabled"}><span>${r.submitted?"완료":"미확인"}</span></label>`}
function categoryClass(category){return({"결석":"absence","지각":"late","조퇴":"early","결과":"result"})[category]||"other"}
function renderRows(rows){if(!rows.length){$("body").className="empty";$("body").textContent="선택한 조건의 출결 기록이 없습니다.";return}$("body").className="table-wrap";$("body").innerHTML=`<table><thead><tr><th>일자</th><th>NEIS 번호</th><th>학교반</th><th>NEIS 학년-반</th><th>성명</th><th>출결구분</th><th>사유</th><th>결시교시</th><th>서류</th></tr></thead><tbody>${rows.map(r=>`<tr><td data-label="일자">${r.date.replaceAll("-",".")}.</td><td data-label="NEIS 번호">${esc(r.num)}</td><td data-label="학교반" class="school">${esc(r.school)}</td><td data-label="NEIS 학년-반" class="neis">${esc(r.neis)}</td><td data-label="성명" class="name">${esc(r.name)}</td><td data-label="출결구분"><span class="pill ${categoryClass(r.category)}">${esc(r.type)}</span></td><td data-label="사유" class="reason">${esc(r.reason||"-")}</td><td data-label="결시교시">${esc(r.periods)}</td><td data-label="서류">${docCell(r)}</td></tr>`).join("")}</tbody></table>`}
async function setDocument(id,checked){if(!canDocs)return;const boxes=[...document.querySelectorAll(`.doc-check[data-id="${CSS.escape(id)}"]`)];boxes.forEach(x=>x.disabled=true);try{const name=staff.displayName||staff.nameKo||staff.nameEn||user.email;await updateDoc(doc(db,"attendanceReports",id),{documentSubmitted:checked,documentCheckedAt:checked?serverTimestamp():null,documentCheckedBy:checked?user.email:"",documentCheckedByName:checked?name:""});for(const rs of cache.values()){const r=rs.find(x=>x.id===id);if(r){r.documentSubmitted=checked;r.documentCheckedByName=checked?name:""}}boxes.forEach(x=>{x.checked=checked;x.nextElementSibling.textContent=checked?"완료":"미확인"});$("status").textContent=`서류 상태가 ${checked?"완료":"미확인"}로 저장되었습니다.`}catch(e){boxes.forEach(x=>x.checked=!checked);$("status").className="status error";$("status").textContent=`저장 실패: ${e.message}`}finally{boxes.forEach(x=>x.disabled=false)}}
async function loadReport(){const k=$("month").value;if(!k)return;const btn=$("load");btn.disabled=true;btn.textContent="조회 중...";$("status").className="status";$("body").className="loading";$("body").textContent="출결 기록을 불러오는 중입니다.";try{const rs=await reports(k),{rows,missing,noNeis}=rowsOf(rs,k);renderSummary(rows);renderRows(rows);$("title").textContent=`${k.replace("-","년 ")}월 ${level==="MS"?"중학교":"고등학교"} 출결상황`;$("meta").textContent=`NEIS 기준 · ${grade||"전체 학년"} · ${cls||"전체 반"} · ${rows.length}행`;const n=[`월 자료 ${rs.length}건 읽음`,`서류 ${canDocs?"변경 가능":"열람만 가능"}`];if(missing)n.push(`학생명단 미매칭 ${missing}건 제외`);if(noNeis)n.push(`NEIS 학년·반 미등록 ${noNeis}건 제외`);$("status").textContent=n.join(" · ")}catch(e){$("body").className="empty";$("body").textContent="보고서를 불러오지 못했습니다.";$("status").className="status error";$("status").textContent=e.message}finally{btn.disabled=false;btn.textContent="조회"}}
function init(){const now=new Date();$("year").innerHTML=`<option>${esc(year)}</option>`;$("month").value=String(year)===String(now.getFullYear())?`${year}-${String(now.getMonth()+1).padStart(2,"0")}`:`${year}-03`;level=roster.some(s=>s.schoolLevel==="MS")?"MS":"HS";grade=cls="";renderFilters();renderSummary([])}function show(x){for(const id of["loading","gate","denied","app"])$(id).style.display=id===x?(id==="app"?"block":"flex"):"none"}
for(const[id,key]of[["levels","level"],["grades","grade"],["classes","cls"]])$(id).addEventListener("click",e=>{const b=e.target.closest(".choice-btn");if(!b)return;if(key==="level"){level=b.dataset.value;grade=cls=""}else if(key==="grade"){grade=b.dataset.value;cls=""}else cls=b.dataset.value;renderFilters()});$("body").addEventListener("change",e=>{if(e.target.matches(".doc-check"))setDocument(e.target.dataset.id,e.target.checked)});$("load").onclick=loadReport;$("reset").onclick=()=>{init();$("body").className="empty";$("body").textContent="월·NEIS 학년·반을 선택하고 조회하세요."};$("print").onclick=()=>print();$("back").onclick=()=>location.href="index.html";$("login").onclick=()=>signInWithPopup(auth,provider).catch(e=>$("gate-error").textContent=e.message);$("logout").onclick=$("denied-logout").onclick=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{if(!u){show("gate");return}show("loading");if(!u.email?.toLowerCase().endsWith("@his.sc.kr")){await signOut(auth);return}try{const[ss,gs]=await Promise.all([getDoc(doc(db,"staff",u.email)),getDoc(doc(db,"settings","general"))]);if(!ss.exists()||!["teacher","staff","admin"].includes(ss.data().role)){show("denied");$("denied-email").textContent=u.email;return}user=u;staff=ss.data();canDocs=staff.role==="admin"||staff.canManageAttendanceDocuments===true;year=String(gs.exists()?gs.data().currentYear||new Date().getFullYear():new Date().getFullYear());roster=await getRoster(year);$("user").textContent=staff.displayName||staff.nameKo||staff.nameEn||u.email;init();show("app")}catch(e){show("gate");$("gate-error").textContent=e.message}});
</script></body></html>
