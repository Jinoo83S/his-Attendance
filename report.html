<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HIS 출결상황보고서</title>
  <style>
    :root {
      --navy:#183b56;
      --navy-dark:#102a3c;
      --blue:#2f78c4;
      --blue-soft:#eaf3fb;
      --green:#7aa66b;
      --green-soft:#eef6eb;
      --line:#d8e0e7;
      --muted:#657786;
      --surface:#ffffff;
      --bg:#f4f7f9;
      --danger:#b33a3a;
      --shadow:0 8px 24px rgba(24,59,86,.09);
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:#1f2d38;font-family:"Noto Sans KR","Malgun Gothic",Arial,sans-serif}
    button,select,input{font:inherit}
    button{cursor:pointer}
    .gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .gate-card{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:32px;box-shadow:var(--shadow);text-align:center}
    .gate-mark{width:54px;height:54px;border-radius:16px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px;margin:0 auto 16px}
    .gate h1{font-size:22px;margin:0 0 8px}.gate p{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 22px}
    .primary-btn,.ghost-btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700}
    .primary-btn{background:var(--navy);color:#fff}.primary-btn:hover{background:var(--navy-dark)}
    .ghost-btn{background:#fff;color:var(--navy);border:1px solid var(--line)}
    #denied{display:none}.error-text{color:var(--danger);font-size:13px;white-space:pre-line}
    #app{display:none;min-height:100vh}
    .topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
    .topbar-inner{max-width:1280px;margin:auto;min-height:64px;padding:10px 22px;display:flex;align-items:center;gap:14px}
    .brand{display:flex;align-items:center;gap:11px;min-width:0}.brand-mark{width:38px;height:38px;border-radius:11px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800}
    .brand-title{font-size:17px;font-weight:800;white-space:nowrap}.brand-sub{font-size:11px;color:var(--muted)}
    .top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}.user-name{font-size:12px;color:var(--muted);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    main{max-width:1280px;margin:auto;padding:24px 22px 56px}
    .page-heading{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:16px}
    .page-heading h1{margin:0;font-size:25px;color:var(--navy)}.page-heading p{margin:5px 0 0;color:var(--muted);font-size:13px}
    .filter-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
    .filter-grid{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));gap:12px;align-items:end}
    .control label{display:block;font-size:12px;font-weight:800;color:var(--navy);margin-bottom:6px}
    .control select,.control input{width:100%;height:42px;border:1px solid #c9d5de;border-radius:9px;background:#fff;padding:0 11px;color:#1f2d38}
    .control select:focus,.control input:focus{outline:3px solid rgba(47,120,196,.15);border-color:var(--blue)}
    .filter-actions{display:flex;gap:8px}.filter-actions button{height:42px;flex:1}
    .mapping-note{margin:12px 0 0;color:var(--muted);font-size:12px;line-height:1.5}
    .mapping-note strong{color:var(--navy)}
    .summary{display:grid;grid-template-columns:repeat(6,minmax(110px,1fr));gap:10px;margin-bottom:16px}
    .summary-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
    .summary-label{font-size:11px;color:var(--muted);margin-bottom:3px}.summary-value{font-size:20px;font-weight:800;color:var(--navy)}
    .report-panel{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
    .report-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;background:linear-gradient(90deg,var(--green-soft),#fff)}
    .report-head h2{font-size:17px;margin:0;color:var(--navy)}.report-meta{font-size:12px;color:var(--muted);margin-left:auto;text-align:right}
    .table-wrap{overflow-x:auto}
    table{width:100%;border-collapse:collapse;min-width:900px}
    th{background:#eef1f3;color:#243746;font-size:12px;font-weight:800;text-align:center;padding:10px 8px;border-bottom:1px solid #aeb9c2;white-space:nowrap}
    td{font-size:13px;padding:9px 8px;border-bottom:1px solid #e3e8ec;text-align:center;vertical-align:middle}
    tbody tr:nth-child(even){background:#fafcfd}tbody tr:hover{background:#f1f7fb}
    td.reason{text-align:left;min-width:190px;white-space:pre-wrap}td.name{font-weight:700;min-width:100px}td.his-class{font-weight:700;color:var(--blue)}
    .type-pill{display:inline-block;border-radius:999px;padding:3px 8px;font-size:12px;font-weight:700;background:var(--blue-soft);color:#235d96;white-space:nowrap}
    .empty,.loading{padding:54px 20px;text-align:center;color:var(--muted)}
    .loading::before{content:"";display:block;width:28px;height:28px;border:3px solid #d9e3ea;border-top-color:var(--blue);border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .status-line{font-size:12px;color:var(--muted);margin:10px 2px 0;min-height:18px}.status-line.error{color:var(--danger)}
    @media(max-width:980px){.filter-grid{grid-template-columns:repeat(3,1fr)}.summary{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:700px){
      .topbar-inner{padding:9px 14px}.brand-sub,.user-name{display:none}.top-actions .ghost-btn{padding:8px 10px;font-size:12px}
      main{padding:18px 12px 40px}.page-heading{align-items:flex-start}.page-heading h1{font-size:21px}.page-heading .ghost-btn{display:none}
      .filter-card{padding:14px}.filter-grid{grid-template-columns:1fr 1fr;gap:10px}.filter-actions{grid-column:1/-1}
      .summary{grid-template-columns:repeat(3,1fr);gap:7px}.summary-card{padding:9px}.summary-value{font-size:17px}
      .report-panel{border-radius:12px}.report-head{align-items:flex-start}.report-meta{text-align:left;margin-left:0}.report-head{flex-direction:column;gap:4px}
      .table-wrap{overflow:visible}table{min-width:0}thead{display:none}tbody{display:block;padding:8px}
      tbody tr{display:block;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;padding:7px;background:#fff!important}
      td{display:grid;grid-template-columns:92px 1fr;gap:8px;text-align:left!important;padding:6px 7px;border:0;font-size:13px;min-width:0!important}
      td::before{content:attr(data-label);font-size:11px;color:var(--muted);font-weight:700}td.name{font-size:14px}
    }
    @media(max-width:420px){.filter-grid{grid-template-columns:1fr}.filter-actions{grid-column:auto}.summary{grid-template-columns:repeat(2,1fr)}}
    @media print{
      @page{size:A4 landscape;margin:10mm}
      body{background:#fff}.topbar,.filter-card,.page-heading .ghost-btn,.status-line{display:none!important}main{max-width:none;padding:0}.page-heading{margin:0 0 8px}.page-heading h1{font-size:18px}.page-heading p{font-size:10px}
      .summary{grid-template-columns:repeat(6,1fr);gap:4px;margin-bottom:8px}.summary-card{box-shadow:none;border-radius:0;padding:5px 7px}.summary-label{font-size:8px}.summary-value{font-size:13px}
      .report-panel{box-shadow:none;border-radius:0}.report-head{padding:7px 9px}.report-head h2{font-size:13px}.report-meta{font-size:9px}
      table{min-width:0}th{font-size:9px;padding:5px 4px}td{font-size:9px;padding:4px}.type-pill{font-size:8px;padding:2px 4px}tr{break-inside:avoid}
    }
  </style>
</head>
<body>
  <section id="gate" class="gate">
    <div class="gate-card">
      <div class="gate-mark">출</div>
      <h1>출결상황보고서</h1>
      <p>등록된 HIS 교직원 계정으로 로그인하세요.<br>Sign in with an authorized HIS staff account.</p>
      <button id="login-btn" class="primary-btn" type="button">Google 계정으로 로그인</button>
      <div id="gate-error" class="error-text" style="margin-top:14px"></div>
    </div>
  </section>

  <section id="denied" class="gate">
    <div class="gate-card">
      <div class="gate-mark" style="background:var(--danger)">!</div>
      <h1>접근 권한 없음</h1>
      <p id="denied-email"></p>
      <button id="denied-logout-btn" class="ghost-btn" type="button">로그아웃</button>
    </div>
  </section>

  <div id="app">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <div class="brand-mark">HIS</div>
          <div><div class="brand-title">출결상황보고서</div><div class="brand-sub">Attendance Status Report</div></div>
        </div>
        <div class="top-actions">
          <span id="user-name" class="user-name"></span>
          <button id="back-btn" class="ghost-btn" type="button">출결 앱</button>
          <button id="logout-btn" class="ghost-btn" type="button">로그아웃</button>
        </div>
      </div>
    </header>

    <main>
      <div class="page-heading">
        <div><h1>출결상황보고서</h1><p>학년·반·월별 출결 목록</p></div>
        <button id="print-btn" class="ghost-btn" type="button">인쇄 / PDF</button>
      </div>

      <section class="filter-card" aria-label="보고서 조회 조건">
        <div class="filter-grid">
          <div class="control"><label for="year-select">학년도</label><select id="year-select"></select></div>
          <div class="control"><label for="month-input">월</label><input id="month-input" type="month"></div>
          <div class="control"><label for="level-select">학교급</label><select id="level-select"><option value="MS">중학교</option><option value="HS">고등학교</option><option value="ES">초등학교</option></select></div>
          <div class="control"><label for="basis-select">조회 기준</label><select id="basis-select"><option value="school">학교 반</option><option value="neis">NEIS 반</option></select></div>
          <div class="control"><label id="grade-label" for="grade-select">학교 학년</label><select id="grade-select"></select></div>
          <div class="control"><label id="class-label" for="class-select">학교 반</label><select id="class-select"></select></div>
          <div class="filter-actions">
            <button id="load-btn" class="primary-btn" type="button">조회</button>
            <button id="reset-btn" class="ghost-btn" type="button">초기화</button>
          </div>
        </div>
        <p id="mapping-note" class="mapping-note"><strong>학교 반 기준:</strong> 학교 학년·반으로 조회합니다. NEIS 반과 자동 변환하지 않습니다.</p>
        <div id="status-line" class="status-line"></div>
      </section>

      <section id="summary" class="summary" aria-label="출결 요약"></section>

      <section class="report-panel">
        <div class="report-head">
          <h2 id="report-title">조회 조건을 선택하세요</h2>
          <div id="report-meta" class="report-meta"></div>
        </div>
        <div id="report-body" class="empty">학년도·월·학년·반을 선택하고 조회하세요.</div>
      </section>
    </main>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
    import { initializeFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBeSyJY2pET002knu7KWKuqV-Nkhy7OEHQ",
      authDomain: "his-main.firebaseapp.com",
      projectId: "his-main",
      storageBucket: "his-main.firebasestorage.app",
      messagingSenderId: "311279275648",
      appId: "1:311279275648:web:3609db730ec2b0e77ea065"
    };
    const ALLOWED_DOMAIN = "his.sc.kr";
    const ROSTER_CACHE_KEY = "hisAttendanceReportRoster_v1";
    const ROSTER_CACHE_MAX_AGE = 12 * 60 * 60 * 1000;
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = initializeFirestore(app, { experimentalAutoDetectLongPolling: true });
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ hd: ALLOWED_DOMAIN });

    let currentUser = null;
    let currentStaff = null;
    let currentYear = "";
    let roster = [];
    const monthlyReportCache = new Map();

    const gate = document.getElementById("gate");
    const denied = document.getElementById("denied");
    const appEl = document.getElementById("app");
    const yearSelect = document.getElementById("year-select");
    const monthInput = document.getElementById("month-input");
    const levelSelect = document.getElementById("level-select");
    const basisSelect = document.getElementById("basis-select");
    const gradeSelect = document.getElementById("grade-select");
    const classSelect = document.getElementById("class-select");
    const statusLine = document.getElementById("status-line");

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[ch]);
    }

    function schoolLevelOf(student) {
      const saved = String(student?.schoolLevel || "").toUpperCase();
      if (["ES","MS","HS"].includes(saved)) return saved;
      const grade = Number(student?.grade);
      if (grade >= 1 && grade <= 6) return "ES";
      if (grade >= 7 && grade <= 9) return "MS";
      if (grade >= 10 && grade <= 12) return "HS";
      return "";
    }

    function naturalCompare(a, b) {
      return String(a).localeCompare(String(b), "ko", { numeric: true, sensitivity: "base" });
    }

    function loadRosterCache(year) {
      try {
        const cached = JSON.parse(localStorage.getItem(ROSTER_CACHE_KEY) || "null");
        if (cached?.year === year && Date.now() - cached.savedAt < ROSTER_CACHE_MAX_AGE) return cached.records || [];
      } catch (_) {}
      return null;
    }

    function saveRosterCache(year, records) {
      try { localStorage.setItem(ROSTER_CACHE_KEY, JSON.stringify({ year, savedAt: Date.now(), records })); } catch (_) {}
    }

    async function loadRoster(year) {
      const cached = loadRosterCache(year);
      if (cached) return cached;
      const snap = await getDocs(query(collection(db, "studentRecords"), where("year", "==", String(year))));
      const records = [];
      snap.forEach(item => {
        const s = item.data();
        if (!s.email || !s.name) return;
        records.push({
          email: String(s.email), name: String(s.name), engName: String(s.engName || ""),
          year: String(s.year || year), grade: String(s.grade || ""), cls: String(s.cls || ""), num: String(s.num || ""),
          schoolLevel: schoolLevelOf(s), neisClassGroup: String(s.neisClassGroup || ""),
          neisCls: String(s.neisCls || ""), neisNum: String(s.neisNum || "")
        });
      });
      saveRosterCache(year, records);
      return records;
    }

    function optionHtml(value, label = value) {
      return `<option value="${escapeHtml(value)}">${escapeHtml(label)}</option>`;
    }

    function relevantRoster() {
      return roster.filter(s => s.schoolLevel === levelSelect.value);
    }

    function populateGradeOptions(preserve = false) {
      const old = preserve ? gradeSelect.value : "";
      const basis = basisSelect.value;
      const field = basis === "school" ? "grade" : "neisClassGroup";
      const values = [...new Set(relevantRoster().map(s => s[field]).filter(Boolean))].sort(naturalCompare);
      gradeSelect.innerHTML = optionHtml("", "전체") + values.map(v => optionHtml(v)).join("");
      if (values.includes(old)) gradeSelect.value = old;
      populateClassOptions(preserve);
    }

    function populateClassOptions(preserve = false) {
      const old = preserve ? classSelect.value : "";
      const basis = basisSelect.value;
      const gradeField = basis === "school" ? "grade" : "neisClassGroup";
      const classField = basis === "school" ? "cls" : "neisCls";
      let students = relevantRoster();
      if (gradeSelect.value) students = students.filter(s => s[gradeField] === gradeSelect.value);
      const values = [...new Set(students.map(s => s[classField]).filter(Boolean))].sort(naturalCompare);
      classSelect.innerHTML = optionHtml("", levelSelect.value === "ES" && basis === "school" ? "반 없음 / 전체" : "전체") + values.map(v => optionHtml(v)).join("");
      if (values.includes(old)) classSelect.value = old;
    }

    function updateBasisLabels() {
      const isNeis = basisSelect.value === "neis";
      document.getElementById("grade-label").textContent = isNeis ? "NEIS 학년" : "학교 학년";
      document.getElementById("class-label").textContent = isNeis ? "NEIS 반" : "학교 반";
      document.getElementById("mapping-note").innerHTML = isNeis
        ? "<strong>NEIS 반 기준:</strong> 학생 DB에 저장된 NEIS 학년·반·번호만 사용합니다. 학교 반에서 추정하지 않습니다."
        : "<strong>학교 반 기준:</strong> 학교 학년·반·번호로 조회합니다. NEIS 반과 자동 변환하지 않습니다.";
    }

    function monthBounds(monthKey) {
      const [year, month] = monthKey.split("-").map(Number);
      const start = `${year}-${String(month).padStart(2,"0")}-01`;
      const last = new Date(year, month, 0).getDate();
      return { start, end: `${year}-${String(month).padStart(2,"0")}-${String(last).padStart(2,"0")}` };
    }

    function datesWithinMonth(startDate, endDate, monthKey) {
      const bounds = monthBounds(monthKey);
      const start = startDate < bounds.start ? bounds.start : startDate;
      const end = endDate > bounds.end ? bounds.end : endDate;
      if (!start || !end || end < start) return [];
      const dates = [];
      const cursor = new Date(start + "T00:00:00");
      const last = new Date(end + "T00:00:00");
      while (cursor <= last) {
        dates.push(`${cursor.getFullYear()}-${String(cursor.getMonth()+1).padStart(2,"0")}-${String(cursor.getDate()).padStart(2,"0")}`);
        cursor.setDate(cursor.getDate() + 1);
      }
      return dates;
    }

    function formatDate(date) {
      return String(date || "").replace(/-/g, ".") + (date ? "." : "");
    }

    async function getMonthlyReports(monthKey) {
      if (monthlyReportCache.has(monthKey)) return monthlyReportCache.get(monthKey);
      const snap = await getDocs(query(collection(db, "attendanceReports"), where("monthKeys", "array-contains", monthKey)));
      const reports = [];
      snap.forEach(item => reports.push({ id: item.id, ...item.data() }));
      monthlyReportCache.set(monthKey, reports);
      return reports;
    }

    function recordMatchesStudent(student) {
      if (!student || student.schoolLevel !== levelSelect.value) return false;
      if (basisSelect.value === "school") {
        if (gradeSelect.value && student.grade !== gradeSelect.value) return false;
        if (classSelect.value && student.cls !== classSelect.value) return false;
      } else {
        if (!student.neisClassGroup || !student.neisCls) return false;
        if (gradeSelect.value && student.neisClassGroup !== gradeSelect.value) return false;
        if (classSelect.value && student.neisCls !== classSelect.value) return false;
      }
      return true;
    }

    function buildRows(reports, monthKey) {
      const rosterByEmail = new Map(roster.map(s => [s.email.toLowerCase(), s]));
      const rows = [];
      let missingRoster = 0;
      let missingNeis = 0;
      reports.forEach(report => {
        const student = rosterByEmail.get(String(report.studentEmail || "").toLowerCase());
        if (!student) { missingRoster++; return; }
        if (basisSelect.value === "neis" && (!student.neisClassGroup || !student.neisCls)) missingNeis++;
        if (!recordMatchesStudent(student)) return;
        datesWithinMonth(report.startDate, report.endDate, monthKey).forEach(date => {
          rows.push({
            date,
            number: basisSelect.value === "neis" ? (student.neisNum || student.num) : student.num,
            hisClass: `${student.grade}${student.cls}`,
            name: student.name || report.studentName || "",
            attendanceType: report.attendanceType || `${report.detail || ""}${report.category || ""}`,
            category: report.category || "",
            reason: report.reason || "",
            periods: Array.isArray(report.periods) ? report.periods.map(String).join(", ") : String(report.periods || ""),
            documentStatus: "—",
            email: student.email
          });
        });
      });
      rows.sort((a,b) => naturalCompare(a.date,b.date) || naturalCompare(a.number,b.number) || naturalCompare(a.name,b.name));
      return { rows, missingRoster, missingNeis };
    }

    function renderSummary(rows) {
      const categories = ["결석","지각","조퇴","결과"];
      const values = [
        ["표시 행", rows.length],
        ["학생", new Set(rows.map(r => r.email)).size],
        ...categories.map(category => [category, rows.filter(r => r.category === category).length])
      ];
      document.getElementById("summary").innerHTML = values.map(([label,value]) =>
        `<div class="summary-card"><div class="summary-label">${escapeHtml(label)}</div><div class="summary-value">${value}</div></div>`
      ).join("");
    }

    function renderRows(rows) {
      const body = document.getElementById("report-body");
      if (!rows.length) { body.className = "empty"; body.textContent = "선택한 조건의 출결 기록이 없습니다."; return; }
      body.className = "table-wrap";
      body.innerHTML = `<table>
        <thead><tr><th>일자</th><th>번호</th><th>학교반</th><th>성명</th><th>출결구분</th><th>사유</th><th>결시교시</th><th>서류</th></tr></thead>
        <tbody>${rows.map(row => `<tr>
          <td data-label="일자">${escapeHtml(formatDate(row.date))}</td>
          <td data-label="번호">${escapeHtml(row.number)}</td>
          <td data-label="학교반" class="his-class">${escapeHtml(row.hisClass)}</td>
          <td data-label="성명" class="name">${escapeHtml(row.name)}</td>
          <td data-label="출결구분"><span class="type-pill">${escapeHtml(row.attendanceType)}</span></td>
          <td data-label="사유" class="reason">${escapeHtml(row.reason || "-")}</td>
          <td data-label="결시교시">${escapeHtml(row.periods)}</td>
          <td data-label="서류">${escapeHtml(row.documentStatus)}</td>
        </tr>`).join("")}</tbody>
      </table>`;
    }

    async function loadReport() {
      const monthKey = monthInput.value;
      if (!yearSelect.value || !monthKey) { statusLine.textContent = "학년도와 월을 선택하세요."; return; }
      const btn = document.getElementById("load-btn");
      btn.disabled = true; btn.textContent = "조회 중...";
      statusLine.className = "status-line"; statusLine.textContent = "";
      const body = document.getElementById("report-body"); body.className = "loading"; body.textContent = "Firebase에서 출결 기록을 불러오는 중입니다.";
      try {
        if (yearSelect.value !== currentYear) {
          roster = await loadRoster(yearSelect.value);
          currentYear = yearSelect.value;
          populateGradeOptions();
        }
        const reports = await getMonthlyReports(monthKey);
        const { rows, missingRoster, missingNeis } = buildRows(reports, monthKey);
        renderSummary(rows); renderRows(rows);
        const levelLabel = {ES:"초등학교",MS:"중학교",HS:"고등학교"}[levelSelect.value];
        const basisLabel = basisSelect.value === "school" ? "학교 반" : "NEIS 반";
        const gradeLabel = gradeSelect.value || "전체 학년";
        const classLabel = classSelect.value || "전체 반";
        document.getElementById("report-title").textContent = `${monthKey.replace("-","년 ")}월 ${levelLabel} 출결상황`;
        document.getElementById("report-meta").textContent = `${basisLabel} · ${gradeLabel} · ${classLabel} · ${rows.length}행`;
        const notes = [`월 자료 ${reports.length}건 읽음`];
        if (missingRoster) notes.push(`학생명단 미매칭 ${missingRoster}건 제외`);
        if (basisSelect.value === "neis" && missingNeis) notes.push(`NEIS 반 미등록 ${missingNeis}건 확인 필요`);
        statusLine.textContent = notes.join(" · ");
      } catch (err) {
        console.error(err); body.className = "empty"; body.textContent = "보고서를 불러오지 못했습니다.";
        statusLine.className = "status-line error"; statusLine.textContent = err.message;
      } finally { btn.disabled = false; btn.textContent = "조회"; }
    }

    function initializeFilters() {
      const now = new Date();
      const defaultMonth = String(currentYear) === String(now.getFullYear())
        ? `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`
        : `${currentYear}-03`;
      yearSelect.innerHTML = optionHtml(currentYear);
      yearSelect.value = currentYear;
      monthInput.value = defaultMonth;
      const levels = [...new Set(roster.map(s => s.schoolLevel).filter(Boolean))];
      levelSelect.value = levels.includes("MS") ? "MS" : (levels[0] || "MS");
      updateBasisLabels(); populateGradeOptions(); renderSummary([]);
    }

    document.getElementById("login-btn").addEventListener("click", async () => {
      document.getElementById("gate-error").textContent = "";
      try { await signInWithPopup(auth, provider); } catch (err) { document.getElementById("gate-error").textContent = err.message; }
    });
    document.getElementById("logout-btn").addEventListener("click", () => signOut(auth));
    document.getElementById("denied-logout-btn").addEventListener("click", () => signOut(auth));
    document.getElementById("back-btn").addEventListener("click", () => { window.location.href = "index.html"; });
    document.getElementById("print-btn").addEventListener("click", () => window.print());
    document.getElementById("load-btn").addEventListener("click", loadReport);
    document.getElementById("reset-btn").addEventListener("click", () => { initializeFilters(); document.getElementById("report-body").className="empty"; document.getElementById("report-body").textContent="학년도·월·학년·반을 선택하고 조회하세요."; statusLine.textContent=""; });
    levelSelect.addEventListener("change", () => populateGradeOptions());
    basisSelect.addEventListener("change", () => { updateBasisLabels(); populateGradeOptions(); });
    gradeSelect.addEventListener("change", () => populateClassOptions());

    onAuthStateChanged(auth, async user => {
      if (!user) { currentUser=null; currentStaff=null; gate.style.display="flex"; denied.style.display="none"; appEl.style.display="none"; return; }
      if (!user.email?.toLowerCase().endsWith(`@${ALLOWED_DOMAIN}`)) {
        document.getElementById("gate-error").textContent = `@${ALLOWED_DOMAIN} 계정만 사용할 수 있습니다.`; await signOut(auth); return;
      }
      const staffSnap = await getDoc(doc(db,"staff",user.email));
      if (!staffSnap.exists() || !["teacher","staff","admin"].includes(staffSnap.data().role)) {
        gate.style.display="none"; denied.style.display="flex"; appEl.style.display="none"; document.getElementById("denied-email").textContent=user.email; return;
      }
      try {
        currentUser=user; currentStaff=staffSnap.data();
        const settingsSnap=await getDoc(doc(db,"settings","general"));
        currentYear=String(settingsSnap.exists()?settingsSnap.data().currentYear||new Date().getFullYear():new Date().getFullYear());
        roster=await loadRoster(currentYear);
        document.getElementById("user-name").textContent=currentStaff.displayName||currentStaff.nameKo||currentStaff.nameEn||user.email;
        gate.style.display="none"; denied.style.display="none"; appEl.style.display="block";
        initializeFilters();
      } catch(err) {
        console.error(err); document.getElementById("gate-error").textContent=err.message; gate.style.display="flex"; appEl.style.display="none";
      }
    });
  </script>
</body>
</html>
